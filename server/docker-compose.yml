services:
  xiaopingu-server:
    build:
      context: .
    container_name: xiaopingu-server
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_FILE: /data/local-data.json
      DEV_OPENID: dev-openid-xiaopingu
    volumes:
      - xiaopingu-server-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  xiaopingu-server-data:
